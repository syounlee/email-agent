[project]
name = "email-agent"
version = "0.1.0"
description = "A step-by-step email agent built with the Claude Agent SDK"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.5.0",
    "claude-agent-sdk>=0.2.178",
    "imapclient>=4.1.0",
    "msal>=1.39.0",
    "python-dotenv>=1.2.4",
    "starlette>=1.10.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
# Short names for the commands, e.g. `uv run email-chat`
email-watch = "email_agent.automation.listen:watch_main"  # watch your mailbox, send alerts (leave running)
email-agent = "email_agent.apps.server:main"      # the Alerts page (also watches your mailbox)
email-chat = "email_agent.apps.chat:run"          # chat in the terminal
email-ask = "email_agent.apps.ask:main"           # one question, one answer
email-listen = "email_agent.automation.listen:main"  # watch / demo / preview listeners
email-sync = "email_agent.mail.imap_sync:main"    # copy your mail into the local database
email-connect = "email_agent.mail.login:main"     # test the connection (Outlook: sign in once)
email-alerts = "email_agent.automation.alerts:main"  # phone alerts: list / test / summary
email-autostart = "email_agent.apps.autostart:main"  # start email-watch at login (on / off / status)

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls Claude (costs money); run only with --live"]
filterwarnings = [
    # search/read run without asking on purpose; only changes need approval
    "ignore::claude_agent_sdk.CanUseToolShadowedWarning",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
