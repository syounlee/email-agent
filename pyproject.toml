[project]
name = "email-agent"
version = "0.1.0"
description = "A step-by-step email agent built with the Claude Agent SDK"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.5.0",
    "claude-agent-sdk>=0.2.178",
    "imapclient>=4.1.0",
    "python-dotenv>=1.2.4",
    "starlette>=1.10.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
# `uv run email-agent` starts the local web server
email-agent = "email_agent.server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls Claude (costs money); run only with --live"]
filterwarnings = [
    # search/read run without asking on purpose; only changes need approval
    "ignore::claude_agent_sdk.CanUseToolShadowedWarning",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
